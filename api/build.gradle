plugins {
    id 'fabrolia-java'
    id 'maven-publish'
    id 'com.gradleup.nmcp' version '1.4.4'
    id 'signing'
    id 'idea'
    id 'net.fabricmc.fabric-loom'
}

group = 'io.github.axalotldev'
version = "1.0.4"

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    compileOnly("net.fabricmc:fabric-loader:$fabric_loader_version")
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly(annotationProcessor'org.projectlombok:lombok:1.18.44')
}

// NeoForge (FML) loads a nested jar without mods.toml as a plugin-layer
// LIBRARY, which cannot see Minecraft classes (the API's collections use
// MobCategory etc.). GAMELIBRARY puts it on the game layer. Fabric ignores it.
jar {
    manifest {
        attributes('FMLModType': 'GAMELIBRARY')
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = group
            artifactId = "${mod_id}-${project.name}"
            version = version
            from components.java
            pom {
                name = mod_id
                description = "Fabrolia API"
                url = "https://github.com/axalotldev/${mod_id}"
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/license/mit/"
                    }
                }
                developers {
                    developer {
                        id = "axalotldev"
                        name = "AxalotlDev"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/axalotldev/${mod_id}.git"
                    developerConnection = "scm:git:ssh://github.com/axalotldev/${mod_id}.git"
                    url = "https://github.com/axalotldev/${mod_id}"
                }
            }
        }
    }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username = findProperty("mavenCentralUsername")
        password = findProperty("mavenCentralPassword")
        publishingType = "USER_MANAGED"
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}
