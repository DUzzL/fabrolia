plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
    id "com.modrinth.minotaur" version "2.10.0"
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "fabrolia"
    versionNumber.set(project.version.toString())
    versionName.set(project.version.toString())
    versionType = "alpha"
    uploadFile.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    gameVersions = ["26.3"]
    loaders = ["neoforge"]
    dependencies {
        optional.project "lithium"
        optional.project "c2me-neoforge"
        incompatible.project "moonrise-opt"
        incompatible.project "open-parties-and-claims"
    }
    changelog = """
"""
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        create("client") {
            client()
        }
        create("server") {
            server()
        }
    }
    mods {
        create("${mod_id}") {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}"))
    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    compileOnly("maven.modrinth:vmp-fabric:${vmp_version}") { transitive = false }
    implementation(jarJar(project(':api')))
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
