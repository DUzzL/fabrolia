// Run from the repository root:
// bash gradlew :common:raidTicketCoverageAudit -I docs/reviews/2026-10-09/raid-audit.init.gradle
gradle.projectsEvaluated {
    def common = gradle.rootProject.findProject(':common')
    if (common == null) return
    def probeClasses = common.layout.buildDirectory.dir('tmp/raid-ticket-audit')
    def compileProbe = common.tasks.register('compileRaidTicketCoverageAudit', JavaCompile) {
        dependsOn common.tasks.named('classes')
        source common.rootProject.file('docs/reviews/2026-10-09/RaidTicketCoverageProbe.java')
        classpath = common.sourceSets.test.runtimeClasspath
        destinationDirectory = probeClasses
        options.compilerArgs += ['-proc:none']
    }
    common.tasks.register('raidTicketCoverageAudit', JavaExec) {
        group = 'verification'
        description = 'Isolated 26.3 raid spawn eligibility with radius-6 and wider tickets.'
        dependsOn compileProbe
        // The historical negative control requires the pre-fix class (radius 6).
        def baseline = common.findProperty('raidAuditBaselineJar')
        classpath = (common.files(probeClasses) + (baseline == null ? common.files() : common.files(baseline))
                + common.sourceSets.test.runtimeClasspath)
        mainClass = 'RaidTicketCoverageProbe'
    }
}
