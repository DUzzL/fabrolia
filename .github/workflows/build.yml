name: Fabrolia Build Script
on:
  push: { }
  pull_request: { }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Production runs Temurin 25; jars must stay at class major 69.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle (wrapper validation and cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabrolia
        run: ./gradlew clean processIncludeJars build --stacktrace

      - name: Check the Fabric release jar
        run: python3 tools/release/check_jar.py fabric/build/libs/fabrolia-alpha_*.jar

      - name: Prepare artifact directory
        run: |
          mkdir jars
          cp neoforge/build/libs/*.jar jars/
          cp fabric/build/libs/*.jar jars/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabrolia-artifacts
          path: jars/*.jar
