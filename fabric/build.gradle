plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "com.modrinth.minotaur" version "2.10.0"
    id 'idea'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "fabrolia"
    versionNumber.set(project.version.toString())
    versionName.set(project.version.toString())
    versionType = "alpha"
    uploadFile.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    gameVersions = ["26.3"]
    loaders = ["fabric", "quilt"]
    dependencies {
        required.project "fabric-api"
        optional.project "lithium"
        optional.project "c2me-fabric"
        incompatible.project "moonrise-opt"
        incompatible.project "open-parties-and-claims"
    }
    changelog = """
"""
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")))
    implementation 'com.electronwill.night-config:toml:3.8.1'
    include 'com.electronwill.night-config:toml:3.8.1'
    include 'com.electronwill.night-config:core:3.8.1'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    compileOnly("maven.modrinth:vmp-fabric:${vmp_version}") { transitive = false }
    implementation(include("me.lucko:fabric-permissions-api:${project.permission_api}"))
    implementation include(project(":api"))
}

loom {
    accessWidenerPath.set(project(':common').file('src/main/resources/fabrolia.accesswidener'))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            vmArgs(
                    "-Xms12G",
                    "-Xmx12G",
                    "--add-modules=jdk.incubator.vector",
                    "-XX:+UnlockExperimentalVMOptions",
                    "-XX:+UseZGC",
                    "-XX:+AlwaysPreTouch",
                    "-XX:+DisableExplicitGC",
                    "-XX:+UseDynamicNumberOfGCThreads"
            )
        }
    }
}

def fabricJar = tasks.named('jar', Jar)
def commonTest = project(':common').tasks.named('test')

tasks.register('verifyPlayerTickArchitecture',
        com.axalotl.fabrolia.gradle.VerifyPlayerTickArchitectureTask) {
    group = 'verification'
    description = 'Binds the tested player-tick bytecode to the exact Fabric jar archive.'
    dependsOn fabricJar, commonTest
    archiveFile.set(fabricJar.flatMap { it.archiveFile })
    ownedOutputs.from(project(':common').sourceSets.main.output, sourceSets.main.output)
    expectedVersion.set(provider { project.version.toString() })
}

tasks.named('build') {
    dependsOn tasks.named('verifyPlayerTickArchitecture')
}
